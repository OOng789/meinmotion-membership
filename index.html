<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Membership</title>


  <!-- LINE LIFF SDK -->

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f5;

      color: #222;

    }


    .container {

      width: 100%;

      max-width: 480px;

      margin: 0 auto;

      padding: 24px;

    }


    .card {

      background: #ffffff;

      border-radius: 20px;

      padding: 24px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.08);

    }


    .center {

      text-align: center;

    }


    /* =========================
       PROFILE IMAGE
    ========================= */

    .profile-image {

      width: 90px;

      height: 90px;

      border-radius: 50%;

      object-fit: cover;

      margin-bottom: 15px;

    }


    /* =========================
       FORM
    ========================= */

    .form-group {

      margin-bottom: 16px;

    }


    label {

      display: block;

      font-size: 14px;

      font-weight: 600;

      margin-bottom: 7px;

    }


    .required {

      color: #e53935;

    }


    .optional {

      color: #999;

      font-weight: normal;

      font-size: 12px;

    }


    input {

      width: 100%;

      padding: 14px;

      border: 1px solid #dddddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

      background: #ffffff;

    }


    input:focus {

      border-color: #06c755;

    }


    input::placeholder {

      color: #aaaaaa;

    }


    /* =========================
       BUTTON
    ========================= */

    button {

      width: 100%;

      padding: 14px;

      border: 0;

      border-radius: 12px;

      font-size: 16px;

      cursor: pointer;

      margin-top: 10px;

    }


    .primary {

      background: #06c755;

      color: #ffffff;

    }


    .primary:disabled {

      background: #9edfb5;

      cursor: not-allowed;

    }


    .secondary {

      background: #eeeeee;

      color: #222222;

    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      text-align: center;

      padding: 70px 20px;

    }


    .spinner {

      width: 40px;

      height: 40px;

      border: 4px solid #dddddd;

      border-top-color: #06c755;

      border-radius: 50%;

      animation: spin 1s linear infinite;

      margin: 0 auto 20px;

    }


    @keyframes spin {

      to {

        transform: rotate(360deg);

      }

    }


    /* =========================
       ERROR
    ========================= */

    .error {

      background: #fff0f0;

      color: #c62828;

      padding: 15px;

      border-radius: 12px;

      margin-top: 15px;

      white-space: pre-wrap;

      word-break: break-word;

    }


    /* =========================
       POINTS
    ========================= */

    .points {

      font-size: 42px;

      font-weight: bold;

      margin: 10px 0;

    }


    /* =========================
       MEMBER INFO
    ========================= */

    .member-info {

      margin-top: 25px;

    }


    .info-row {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 20px;

      padding: 12px 0;

      border-bottom: 1px solid #eeeeee;

    }


    .info-label {

      color: #777777;

      flex-shrink: 0;

    }


    .info-value {

      text-align: right;

      word-break: break-word;

    }


    hr {

      border: 0;

      border-top: 1px solid #eeeeee;

      margin: 25px 0;

    }


    h2 {

      margin-top: 5px;

    }


    .note {

      font-size: 13px;

      color: #888888;

      line-height: 1.5;

      margin-bottom: 20px;

    }


    .hidden {

      display: none !important;

    }

  </style>

</head>


<body>


<!-- =====================================
     LOADING SCREEN
===================================== -->

<div
  id="loading"
  class="loading"
>

  <div class="spinner"></div>

  <div id="loadingText">

    กำลังเชื่อมต่อ LINE...

  </div>

</div>


<!-- =====================================
     ERROR SCREEN
===================================== -->

<div
  id="errorScreen"
  class="container hidden"
>

  <div class="card">

    <div class="center">

      <h2>⚠️</h2>

      <h3>
        เกิดข้อผิดพลาด
      </h3>

    </div>


    <div
      id="errorMessage"
      class="error"
    ></div>


    <button
      class="secondary"
      onclick="location.reload()"
    >

      ลองใหม่

    </button>

  </div>

</div>


<!-- =====================================
     REGISTER SCREEN
===================================== -->

<div
  id="registerScreen"
  class="container hidden"
>

  <div class="card">


    <div class="center">

      <img
        id="registerImage"
        class="profile-image"
        alt="LINE Profile"
      >


      <h2>
        สมัครสมาชิก
      </h2>


      <p class="note">

        กรอกข้อมูลเพื่อสมัครสมาชิก

        <br>

        ชื่อ นามสกุล และเบอร์โทรศัพท์
        จำเป็นต้องกรอก

      </p>

    </div>


    <!-- =========================
         FIRST NAME
    ========================= -->

    <div class="form-group">

      <label>

        ชื่อ

        <span class="required">
          *
        </span>

      </label>


      <input
        id="firstName"
        type="text"
        placeholder="กรุณากรอกชื่อ"
        autocomplete="given-name"
      >

    </div>


    <!-- =========================
         LAST NAME
    ========================= -->

    <div class="form-group">

      <label>

        นามสกุล

        <span class="required">
          *
        </span>

      </label>


      <input
        id="lastName"
        type="text"
        placeholder="กรุณากรอกนามสกุล"
        autocomplete="family-name"
      >

    </div>


    <!-- =========================
         PHONE
    ========================= -->

    <div class="form-group">

      <label>

        เบอร์โทรศัพท์

        <span class="required">
          *
        </span>

      </label>


      <input
        id="phone"
        type="tel"
        inputmode="tel"
        placeholder="กรุณากรอกเบอร์โทรศัพท์"
        autocomplete="tel"
      >

    </div>


    <!-- =========================
         EMAIL
    ========================= -->

    <div class="form-group">

      <label>

        Email

        <span class="optional">
          (ไม่บังคับ)
        </span>

      </label>


      <input
        id="email"
        type="email"
        placeholder="กรอก Email หากต้องการ"
        autocomplete="email"
      >

    </div>


    <!-- =========================
         PROVINCE
    ========================= -->

    <div class="form-group">

      <label>

        จังหวัด

        <span class="optional">
          (ไม่บังคับ)
        </span>

      </label>


      <input
        id="province"
        type="text"
        placeholder="กรอกจังหวัด หากต้องการ"
        autocomplete="address-level1"
      >

    </div>


    <!-- =========================
         REGISTER BUTTON
    ========================= -->

    <button
      id="registerButton"
      class="primary"
      onclick="registerMember()"
    >

      สมัครสมาชิก

    </button>


  </div>

</div>


<!-- =====================================
     DASHBOARD
===================================== -->

<div
  id="dashboardScreen"
  class="container hidden"
>

  <div class="card">


    <!-- =========================
         PROFILE
    ========================= -->

    <div class="center">

      <img
        id="profileImage"
        class="profile-image"
        alt="LINE Profile"
      >


      <h2
        id="profileName"
      ></h2>


      <p>
        คะแนนสะสม
      </p>


      <div
        id="points"
        class="points"
      >
        0
      </div>


      <p>
        คะแนน
      </p>

    </div>


    <hr>


    <!-- =========================
         MEMBER INFORMATION
    ========================= -->

    <div class="member-info">

      <h3>
        ข้อมูลสมาชิก
      </h3>


      <!-- FIRST NAME -->

      <div class="info-row">

        <span class="info-label">
          ชื่อ
        </span>


        <span
          id="memberFirstName"
          class="info-value"
        >
          -
        </span>

      </div>


      <!-- LAST NAME -->

      <div class="info-row">

        <span class="info-label">
          นามสกุล
        </span>


        <span
          id="memberLastName"
          class="info-value"
        >
          -
        </span>

      </div>


      <!-- PHONE -->

      <div class="info-row">

        <span class="info-label">
          เบอร์โทร
        </span>


        <span
          id="memberPhone"
          class="info-value"
        >
          -
        </span>

      </div>


      <!-- EMAIL -->

      <div class="info-row">

        <span class="info-label">
          Email
        </span>


        <span
          id="memberEmail"
          class="info-value"
        >
          -
        </span>

      </div>


      <!-- PROVINCE -->

      <div class="info-row">

        <span class="info-label">
          จังหวัด
        </span>


        <span
          id="memberProvince"
          class="info-value"
        >
          -
        </span>

      </div>

    </div>


  </div>

</div>


<script>


/* =====================================
   CONFIGURATION
===================================== */


/*
 * ใส่ LIFF ID ของคุณตรงนี้
 */

const LIFF_ID =
  '2010909031-tWUD4KXE';


/*
 * ใส่ Apps Script /exec URL ตรงนี้
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxPcTr9eI-Ckon-FUxwF_XNEMRt5DTzYNOvbYr0jZYzd-jsomyU0TOGPiPdUAP6P3A/exec';



/* =====================================
   GLOBAL USER DATA
===================================== */

let lineProfile = null;



/* =====================================
   START APP
===================================== */

document.addEventListener(
  'DOMContentLoaded',
  startApp
);



async function startApp() {

  try {


    setLoading(
      'กำลังเริ่มต้น LIFF...'
    );


    /* =========================
       CHECK CONFIG
    ========================= */

    if (
      !LIFF_ID ||
      LIFF_ID ===
        'ใส่_LIFF_ID_ตรงนี้'
    ) {

      throw new Error(
        'ยังไม่ได้ใส่ LIFF ID'
      );

    }


    if (
      !API_URL ||
      API_URL ===
        'ใส่_APPS_SCRIPT_EXEC_URL_ตรงนี้'
    ) {

      throw new Error(
        'ยังไม่ได้ใส่ Apps Script API URL'
      );

    }


    /* =========================
       INIT LIFF
    ========================= */

    await liff.init({

      liffId: LIFF_ID

    });


    /* =========================
       CHECK LOGIN
    ========================= */

    if (!liff.isLoggedIn()) {

      setLoading(
        'กำลังเข้าสู่ระบบ LINE...'
      );


      liff.login();


      return;

    }


    /* =========================
       GET LINE PROFILE
    ========================= */

    setLoading(
      'กำลังโหลดข้อมูลสมาชิก...'
    );


    lineProfile =
      await liff.getProfile();


    /* =========================
       CHECK MEMBER
    ========================= */

    const result =
      await apiRequest(

        'checkMember',

        {

          userId:
            lineProfile.userId

        }

      );


    if (!result.success) {

      throw new Error(
        result.message ||
        'ตรวจสอบสมาชิกไม่สำเร็จ'
      );

    }


    /* =========================
       EXISTING MEMBER
    ========================= */

    if (result.member) {

      showDashboard(
        result.member
      );


      return;

    }


    /* =========================
       NEW MEMBER
    ========================= */

    showRegister();


  } catch (error) {

    console.error(
      'START APP ERROR:',
      error
    );


    showError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================
   REGISTER MEMBER
===================================== */

async function registerMember() {

  try {


    /* =========================
       GET FORM VALUES
    ========================= */

    const firstName =
      document
        .getElementById(
          'firstName'
        )
        .value
        .trim();


    const lastName =
      document
        .getElementById(
          'lastName'
        )
        .value
        .trim();


    const phone =
      document
        .getElementById(
          'phone'
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          'email'
        )
        .value
        .trim();


    const province =
      document
        .getElementById(
          'province'
        )
        .value
        .trim();



    /* =========================
       REQUIRED VALIDATION
    ========================= */


    // ชื่อ

    if (!firstName) {

      alert(
        'กรุณากรอกชื่อ'
      );

      document
        .getElementById(
          'firstName'
        )
        .focus();

      return;

    }


    // นามสกุล

    if (!lastName) {

      alert(
        'กรุณากรอกนามสกุล'
      );

      document
        .getElementById(
          'lastName'
        )
        .focus();

      return;

    }


    // เบอร์โทร

    if (!phone) {

      alert(
        'กรุณากรอกเบอร์โทรศัพท์'
      );

      document
        .getElementById(
          'phone'
        )
        .focus();

      return;

    }



    /* =========================
       DISABLE BUTTON
    ========================= */

    const button =
      document.getElementById(
        'registerButton'
      );


    button.disabled = true;


    button.textContent =
      'กำลังสมัครสมาชิก...';



    setLoading(
      'กำลังสมัครสมาชิก...'
    );



    /* =========================
       SEND DATA
    ========================= */

    const data = {

      userId:
        lineProfile.userId,


      displayName:
        lineProfile.displayName,


      pictureUrl:
        lineProfile.pictureUrl,


      firstName:
        firstName,


      lastName:
        lastName,


      phone:
        phone,


      email:
        email,


      province:
        province

    };



    const result =
      await apiRequest(

        'registerMember',

        data

      );



    /* =========================
       CHECK RESULT
    ========================= */

    if (!result.success) {

      throw new Error(
        result.message ||
        'สมัครสมาชิกไม่สำเร็จ'
      );

    }



    /* =========================
       GET MEMBER AGAIN
    ========================= */

    setLoading(
      'กำลังโหลดข้อมูลสมาชิก...'
    );


    const memberResult =
      await apiRequest(

        'checkMember',

        {

          userId:
            lineProfile.userId

        }

      );



    if (
      memberResult.success &&
      memberResult.member
    ) {

      showDashboard(
        memberResult.member
      );

      return;

    }



    /* =========================
       FALLBACK
    ========================= */

    showDashboard({

      DISPLAY_NAME:
        lineProfile.displayName,

      PICTURE_URL:
        lineProfile.pictureUrl,

      First_Name:
        firstName,

      Last_Name:
        lastName,

      Phone:
        phone,

      Email:
        email,

      Province:
        province,

      POINTS:
        0

    });


  } catch (error) {

    console.error(
      'REGISTER ERROR:',
      error
    );


    showError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================
   API REQUEST
===================================== */

async function apiRequest(
  action,
  data
) {


  const response =
    await fetch(

      API_URL,

      {

        method: 'POST',


        headers: {

          /*
           * ใช้ text/plain
           * เพื่อลดปัญหา CORS preflight
           */

          'Content-Type':
            'text/plain;charset=utf-8'

        },


        body:
          JSON.stringify({

            action:
              action,

            ...data

          })

      }

    );



  /* =========================
     HTTP ERROR
  ========================= */

  if (!response.ok) {

    throw new Error(

      'Backend HTTP Error: ' +
      response.status

    );

  }



  /* =========================
     JSON
  ========================= */

  return await response.json();

}



/* =====================================
   SHOW REGISTER
===================================== */

function showRegister() {


  hideAll();


  /* =========================
     PROFILE IMAGE
  ========================= */

  document
    .getElementById(
      'registerImage'
    )
    .src =
      lineProfile.pictureUrl || '';



  /* =========================
     SHOW SCREEN
  ========================= */

  document
    .getElementById(
      'registerScreen'
    )
    .classList
    .remove(
      'hidden'
    );

}



/* =====================================
   SHOW DASHBOARD
===================================== */

function showDashboard(
  member
) {


  hideAll();



  /* =========================
     BASIC PROFILE
  ========================= */

  const displayName =
    member.DISPLAY_NAME ||
    lineProfile.displayName ||
    'สมาชิก';


  const picture =
    member.PICTURE_URL ||
    lineProfile.pictureUrl ||
    '';


  const points =
    Number(
      member.POINTS || 0
    );



  /* =========================
     PROFILE NAME
  ========================= */

  document
    .getElementById(
      'profileName'
    )
    .textContent =
      displayName;



  /* =========================
     PROFILE IMAGE
  ========================= */

  document
    .getElementById(
      'profileImage'
    )
    .src =
      picture;



  /* =========================
     POINTS
  ========================= */

  document
    .getElementById(
      'points'
    )
    .textContent =
      points;



  /* =========================
     MEMBER DATA
  ========================= */

  document
    .getElementById(
      'memberFirstName'
    )
    .textContent =
      member.First_Name || '-';


  document
    .getElementById(
      'memberLastName'
    )
    .textContent =
      member.Last_Name || '-';


  document
    .getElementById(
      'memberPhone'
    )
    .textContent =
      member.Phone || '-';


  document
    .getElementById(
      'memberEmail'
    )
    .textContent =
      member.Email || '-';


  document
    .getElementById(
      'memberProvince'
    )
    .textContent =
      member.Province || '-';



  /* =========================
     SHOW DASHBOARD
  ========================= */

  document
    .getElementById(
      'dashboardScreen'
    )
    .classList
    .remove(
      'hidden'
    );

}



/* =====================================
   LOADING SCREEN
===================================== */

function setLoading(
  message
) {


  hideAll();


  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      message;


  document
    .getElementById(
      'loading'
    )
    .classList
    .remove(
      'hidden'
    );

}



/* =====================================
   ERROR SCREEN
===================================== */

function showError(
  message
) {


  hideAll();


  document
    .getElementById(
      'errorMessage'
    )
    .textContent =
      message;


  document
    .getElementById(
      'errorScreen'
    )
    .classList
    .remove(
      'hidden'
    );

}



/* =====================================
   HIDE ALL SCREENS
===================================== */

function hideAll() {


  document
    .querySelectorAll(
      'body > div'
    )
    .forEach(

      element => {

        element
          .classList
          .add(
            'hidden'
          );

      }

    );

}

</script>


</body>

</html>
